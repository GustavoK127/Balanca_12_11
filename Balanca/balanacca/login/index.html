<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema XYZ</title>
    <link rel="stylesheet" href="../estilos/login.css">
    <link rel="stylesheet" href="../estilos/ajustes.css">
</head>
<body>
    <div class="caixa-login">
        <h1>Acesso ao Sistema</h1>
        <form method="post" action="autenticacao.php" autocomplete="off">
            <table class="formulario">
                <tr>
                    <td><label for="usuario">Usuário</label></td>
                    <td><input type="email" id="usuario" name="usuario" maxlength="80" placeholder="Seu melhor e-mail" size="30" required autofocus></td>
                </tr>
                <tr>
                    <td><label for="senha">Senha</label></td>
                    <td><input type="password" id="senha" name="senha" maxlength="12" placeholder="Sua senha" size="12" required></td>
                </tr>
                <tr>
                    <td></td>
                    <td>
                        <input type="submit" value="Entrar">
                        <input type="reset" value="Apagar">
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
